<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" role="img" aria-labelledby="title desc">
  <title id="title">Micro-Transformer baseline architecture</title>
  <desc id="desc">A top-to-bottom diagram of a decoder-only causal transformer with learned token and position embeddings, five pre-normalized transformer blocks, tied output weights, and 128 output classes.</desc>
  <defs>
    <style>
      .title { font: 700 52px Helvetica, Arial, sans-serif; fill: #111; }
      .subtitle { font: 25px Helvetica, Arial, sans-serif; fill: #333; }
      .label { font: 27px Helvetica, Arial, sans-serif; fill: #111; text-anchor: middle; }
      .small { font: 21px Helvetica, Arial, sans-serif; fill: #222; text-anchor: middle; }
      .note { font: 20px Helvetica, Arial, sans-serif; fill: #333; }
      .box { stroke: #111; stroke-width: 5; rx: 14; }
      .group { fill: #f7f7f7; stroke: #111; stroke-width: 6; rx: 28; }
      .arrow { fill: none; stroke: #111; stroke-width: 5; stroke-linecap: square; stroke-linejoin: round; }
      .residual { fill: none; stroke: #111; stroke-width: 4; stroke-linecap: square; stroke-linejoin: round; }
      .arrowhead { fill: #111; }
      .junction { fill: #111; }
    </style>
  </defs>

  <rect width="1200" height="1800" fill="#ffffff"/>
  <text class="title" x="600" y="66" text-anchor="middle">MICRO-TRANSFORMER</text>
  <text class="subtitle" x="600" y="108" text-anchor="middle">Vanilla decoder-only causal baseline · 1,024,512 parameters</text>

  <text class="label" x="600" y="164">Input token IDs [batch, time ≤ 128]</text>
  <path class="arrow" d="M600 184 L600 210"/>
  <path class="arrowhead" d="M594 210 L606 210 L600 220 Z"/>

  <rect class="box" x="270" y="220" width="660" height="82" fill="#efdadd"/>
  <text class="label" x="600" y="255">Token embedding + learned position embedding</text>
  <text class="small" x="600" y="286">129 input IDs × 128 · positions 0–127 × 128</text>

  <rect class="group" x="200" y="340" width="800" height="1060"/>
  <text class="label" x="600" y="395">TRANSFORMER BLOCK × 5</text>
  <text class="small" x="600" y="430">pre-norm residual architecture · dropout 0.0</text>

  <path class="arrow" d="M600 302 L600 460"/>
  <path class="arrowhead" d="M594 460 L606 460 L600 470 Z"/>
  <circle class="junction" cx="600" cy="450" r="6"/>

  <rect class="box" x="415" y="470" width="370" height="64" fill="#f1f0b9"/>
  <text class="label" x="600" y="512">LayerNorm · 128</text>

  <path class="arrow" d="M600 534 L600 600"/>
  <path class="arrowhead" d="M594 600 L606 600 L600 610 Z"/>
  <rect class="box" x="320" y="610" width="560" height="145" fill="#f5d2a1"/>
  <text class="label" x="600" y="662">Causal self-attention</text>
  <text class="small" x="600" y="699">Q, K, V: 128 → 128 · 4 heads × 32</text>
  <text class="small" x="600" y="730">causal mask · output projection 128 → 128</text>

  <path class="arrow" d="M600 755 L600 825"/>
  <path class="arrowhead" d="M594 825 L606 825 L600 835 Z"/>
  <rect class="box" x="440" y="835" width="320" height="64" fill="#f7f0b5"/>
  <text class="label" x="600" y="877">Residual add</text>
  <path class="residual" d="M600 450 L270 450 L270 867 L428 867"/>
  <path class="arrowhead" d="M428 861 L428 873 L440 867 Z"/>

  <path class="arrow" d="M600 899 L600 960"/>
  <path class="arrowhead" d="M594 960 L606 960 L600 970 Z"/>
  <circle class="junction" cx="600" cy="950" r="6"/>
  <rect class="box" x="415" y="970" width="370" height="64" fill="#f1f0b9"/>
  <text class="label" x="600" y="1012">LayerNorm · 128</text>

  <path class="arrow" d="M600 1034 L600 1100"/>
  <path class="arrowhead" d="M594 1100 L606 1100 L600 1110 Z"/>
  <rect class="box" x="320" y="1110" width="560" height="140" fill="#bfe3f1"/>
  <text class="label" x="600" y="1162">Feed-forward network</text>
  <text class="small" x="600" y="1198">Linear 128 → 512 · GELU</text>
  <text class="small" x="600" y="1228">Linear 512 → 128</text>

  <path class="arrow" d="M600 1250 L600 1310"/>
  <path class="arrowhead" d="M594 1310 L606 1310 L600 1320 Z"/>
  <rect class="box" x="440" y="1320" width="320" height="64" fill="#f7f0b5"/>
  <text class="label" x="600" y="1362">Residual add</text>
  <path class="residual" d="M600 950 L270 950 L270 1352 L428 1352"/>
  <path class="arrowhead" d="M428 1346 L428 1358 L440 1352 Z"/>

  <text class="note" x="900" y="650">Optional LoRA:</text>
  <text class="note" x="900" y="680">Q and V projections</text>
  <text class="note" x="900" y="710">Baseline: disabled</text>

  <text class="note" x="48" y="1230">Decoder-only:</text>
  <text class="note" x="48" y="1260">no encoder</text>
  <text class="note" x="48" y="1290">no cross-attention</text>

  <path class="arrow" d="M600 1384 L600 1445"/>
  <path class="arrowhead" d="M594 1445 L606 1445 L600 1455 Z"/>
  <rect class="box" x="430" y="1455" width="340" height="70" fill="#f1f0b9"/>
  <text class="label" x="600" y="1500">Final LayerNorm · 128</text>

  <path class="arrow" d="M600 1525 L600 1590"/>
  <path class="arrowhead" d="M594 1590 L606 1590 L600 1600 Z"/>
  <rect class="box" x="350" y="1600" width="500" height="70" fill="#d8e2f3"/>
  <text class="label" x="600" y="1645">Tied output projection · 128 classes</text>
  <text class="small" x="935" y="1633">uses token embedding</text>
  <text class="small" x="935" y="1661">weights [0:128]</text>

  <path class="arrow" d="M600 1670 L600 1715"/>
  <path class="arrowhead" d="M594 1715 L606 1715 L600 1725 Z"/>
  <text class="label" x="600" y="1770">Next-token logits [batch, time, 128]</text>
</svg>

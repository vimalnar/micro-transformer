<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" role="img" aria-labelledby="title desc">
  <title id="title">Micro-Transformer and Micro-World system boundaries</title>
  <desc id="desc">Two implemented tracks are shown separately. The language data and transformer track creates validated episodes and trains or runs a causal model. The Micro-World track steps a deterministic simulator and exposes partial observations, events, and media to a browser inspector. A dotted experimental adapter marks an optional, separately evaluated connection rather than a built-in trained controller.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#344054"/></marker>
    <marker id="dotted-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8a5a00"/></marker>
    <style>
      .title { font: 700 38px Arial, sans-serif; fill: #152238; }
      .lane { font: 700 24px Arial, sans-serif; fill: #152238; }
      .label { font: 700 20px Arial, sans-serif; fill: #182230; text-anchor: middle; }
      .small { font: 16px Arial, sans-serif; fill: #344054; text-anchor: middle; }
      .tiny { font: 15px Arial, sans-serif; fill: #475467; text-anchor: middle; }
      .node { stroke: #344054; stroke-width: 2.5; rx: 18; }
      .flow { fill: none; stroke: #344054; stroke-width: 3; marker-end: url(#arrow); }
      .optional { fill: none; stroke: #b7791f; stroke-width: 3; stroke-dasharray: 9 8; marker-end: url(#dotted-arrow); }
    </style>
  </defs>
  <rect width="1600" height="1020" fill="#fff"/>
  <text class="title" x="800" y="62" text-anchor="middle">Two explicit systems, one research repository</text>

  <rect x="65" y="105" width="1470" height="365" rx="26" fill="#f5f7ff" stroke="#c7d2fe" stroke-width="3"/>
  <text class="lane" x="100" y="150">Formal-language and model path</text>
  <rect class="node" x="105" y="205" width="245" height="150" fill="#e9eefe"/>
  <text class="label" x="227" y="248">Fixed language</text><text class="small" x="227" y="281">128-token vocabulary</text><text class="small" x="227" y="309">grammar + semantics</text>
  <path class="flow" d="M350 280 H395"/>
  <rect class="node" x="405" y="205" width="260" height="150" fill="#e5f5ec"/>
  <text class="label" x="535" y="248">Generator +</text><text class="label" x="535" y="274">reference interpreter</text><text class="small" x="535" y="315">derive labels; validate episodes</text>
  <path class="flow" d="M665 280 H710"/>
  <rect class="node" x="720" y="205" width="245" height="150" fill="#e5f5ec"/>
  <text class="label" x="842" y="248">JSONL + manifest</text><text class="small" x="842" y="281">provenance and split</text><text class="small" x="842" y="309">identities</text>
  <path class="flow" d="M965 280 H1010"/>
  <rect class="node" x="1020" y="205" width="240" height="150" fill="#e9eefe"/>
  <text class="label" x="1140" y="248">Prepare + train</text><text class="small" x="1140" y="281">PyTorch causal model</text><text class="small" x="1140" y="309">evaluation and reports</text>
  <path class="flow" d="M1260 280 H1300"/>
  <rect class="node" x="1310" y="205" width="195" height="150" fill="#e1eafe"/>
  <text class="label" x="1407" y="248">Checkpoint</text><text class="small" x="1407" y="281">frozen inference</text><text class="small" x="1407" y="309">token logits</text>

  <rect x="65" y="545" width="1470" height="350" rx="26" fill="#f2fbf7" stroke="#a8d5bf" stroke-width="3"/>
  <text class="lane" x="100" y="590">Micro-World path</text>
  <rect class="node" x="105" y="640" width="270" height="145" fill="#e9eefe"/>
  <text class="label" x="240" y="686">Typed action</text><text class="small" x="240" y="720">forward · turn · interact</text><text class="small" x="240" y="748">take · drop · wait</text>
  <path class="flow" d="M375 712 H430"/>
  <rect class="node" x="440" y="640" width="300" height="145" fill="#d9f2e6"/>
  <text class="label" x="590" y="686">Deterministic</text><text class="label" x="590" y="712">grid simulation</text><text class="small" x="590" y="750">state, rules, tick, replay</text>
  <path class="flow" d="M740 712 H795"/>
  <rect class="node" x="805" y="640" width="300" height="145" fill="#e5f5ec"/>
  <text class="label" x="955" y="686">Partial observation</text><text class="small" x="955" y="720">9 × 9 egocentric view</text><text class="small" x="955" y="748">events + replay identity</text>
  <path class="flow" d="M1105 712 H1160"/>
  <rect class="node" x="1170" y="640" width="320" height="145" fill="#e9eefe"/>
  <text class="label" x="1330" y="686">Renderer + service</text><text class="small" x="1330" y="720">PNG/RGB, symbolic cues</text><text class="small" x="1330" y="748">browser inspector</text>

  <rect x="534" y="425" width="532" height="88" rx="16" fill="#fff8e6" stroke="#b7791f" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text class="label" x="800" y="460">Optional task-specific experiment adapter</text>
  <text class="small" x="800" y="490">A separate interface; the bundled checkpoint is not a trained world controller.</text>
  <path class="optional" d="M955 640 V525"/>
  <path class="optional" d="M1068 469 C1200 469 1320 440 1405 360"/>
  <path class="optional" d="M534 469 C420 469 315 470 240 640"/>
  <text class="tiny" x="800" y="945">The formal interpreter owns language-answer truth. The simulator owns interactive world truth. No baseline component silently joins them.</text>
</svg>

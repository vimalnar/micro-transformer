[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "micro-transformer"
version = "0.1.0"
description = "A deterministic language, dataset, world, and small-transformer research baseline."
requires-python = ">=3.9"

[project.optional-dependencies]
web = ["fastapi", "uvicorn"]
test = ["httpx"]
dev = ["fastapi", "uvicorn", "httpx"]

[project.scripts]
micro-transformer-generate = "micro_transformer.data.generator:main"

[tool.setuptools.packages.find]
where = ["micro-world"]

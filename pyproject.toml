[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "micro-transformer"
version = "0.1.1"
description = "A deterministic language, dataset, world, and small-transformer research baseline."
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Vimal Naran"}]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]

[project.optional-dependencies]
web = ["fastapi", "uvicorn"]
test = ["httpx"]
training = ["torch==2.8.0", "numpy==2.0.2"]
dev = ["fastapi", "uvicorn", "httpx"]

[project.scripts]
micro-transformer-generate = "micro_transformer.data.generator:main"

[tool.setuptools]
packages = [
    "harness",
    "training",
    "micro_transformer",
    "micro_transformer.data",
    "micro_world",
    "micro_world.media",
    "micro_world.protocol",
    "micro_world.service",
    "micro_world.simulation",
]

[tool.setuptools.package-dir]
micro_transformer = "micro-world/micro_transformer"
micro_world = "micro-world/micro_world"
